<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Principal - IZAR</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- "caja" da el ancho de móvil y "aplicacion" la distribución interna de la pantalla -->
    <main class="caja aplicacion">

        <!-- ===================== CABECERA: logo y perfil ===================== -->
        <header class="cabecera-app">
            <div class="marca">
                <svg class="estrella" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/>
                </svg>
                <span class="nombre">IZAR</span>
            </div>
            <!-- Engranaje: lleva a la página de ajustes -->
            <a href="ajustes.html" class="icono-ajustes" aria-label="Ajustes"><svg viewBox="0 0 24 24"><path d="M19.4 13c.04-.33.06-.66.06-1s-.02-.67-.06-1l2.11-1.65a.5.5 0 0 0 .12-.64l-2-3.46a.5.5 0 0 0-.61-.22l-2.49 1a7.3 7.3 0 0 0-1.73-1l-.38-2.65A.5.5 0 0 0 14 1h-4a.5.5 0 0 0-.49.42l-.38 2.65c-.62.25-1.2.59-1.73 1l-2.49-1a.5.5 0 0 0-.61.22l-2 3.46a.5.5 0 0 0 .12.64L4.6 11c-.04.33-.06.66-.06 1s.02.67.06 1l-2.11 1.65a.5.5 0 0 0-.12.64l2 3.46c.14.24.44.32.68.22l2.49-1c.53.41 1.11.75 1.73 1l.38 2.65c.04.24.25.42.49.42h4c.24 0 .45-.18.49-.42l.38-2.65c.62-.25 1.2-.59 1.73-1l2.49 1c.24.1.54.02.68-.22l2-3.46a.5.5 0 0 0-.12-.64L19.4 13zM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7z"/></svg></a>
        </header>

        <!-- ===================== CÍRCULO Y BOTÓN DE REGISTRO ===================== -->
        <section class="tarjeta-indicador">
            <div class="circulo-progreso">
                <div class="texto-circulo">
                    <!-- Textos de espera: principal.js los sustituye con los datos de /dashboard -->
                    <h4 id="dia-ciclo">Cargando...</h4>
                    <p id="proximo-periodo"></p>
                </div>
            </div>
            <!-- Abre la ventana del calendario. principal.js cambia el texto:
                 "REGISTRAR PERIODO (+)" o "TERMINAR PERIODO" si hay uno en curso -->
            <button id="registro" class="boton boton-principal">REGISTRAR PERIODO (+)</button>
        </section>

        <!-- ===================== TIRA DEL CALENDARIO SEMANAL ===================== -->
        <!-- principal.js pone la clase "activo" (rosa) al día de la semana de hoy -->
        <section class="calendario-semanal">
            <div class="dia">L</div>
            <div class="dia">M</div>
            <div class="dia">X</div>
            <div class="dia">J</div>
            <div class="dia">V</div>
            <div class="dia">S</div>
            <div class="dia">D</div>
        </section>

        <!-- ===================== SÍNTOMAS (cuadrícula 2x2) ===================== -->
        <section class="caja-sintomas">
            <!-- Cabecera de la caja: título a la izquierda y botón de borrar a la derecha.
                 Reutiliza la clase "cabecera-app" (la de arriba del todo), que ya pone
                 un elemento a cada lado (display: flex + space-between). -->
            <div class="cabecera-app">
                <h3 class="titulo-seccion">REGISTRO RÁPIDO DE HOY</h3>
                <!-- Borra los síntomas registrados hoy.
                     De momento NO hace nada: falta conectarlo en principal.js y crear la ruta en app.py. -->
                <button id="borrar-sintomas" class="boton-sintoma" type="button"><span>🗑️</span> Borrar hoy</button>
            </div>
            <!-- data-sintoma guarda el nombre que se envía al servidor. Tiene que coincidir
                 con SINTOMAS_VALIDOS de ciclos.py (minúsculas y sin tildes).
                 El texto que se ve puede llevar tildes: eso es solo para la usuaria. -->
            <div class="grid-sintomas">
                <button class="boton-sintoma" data-sintoma="colicos"><span>〰️</span> Cólicos</button>
                <button class="boton-sintoma" data-sintoma="flujo"><span>💧</span> Flujo</button>
                <button class="boton-sintoma" data-sintoma="animo"><span>🙂</span> Ánimo</button>
                <button class="boton-sintoma" data-sintoma="sueno"><span>💤</span> Sueño</button>
            </div>
            <!-- Aquí principal.js escribe si se ha guardado o si ha habido un error -->
            <p id="mensaje-sintomas" class="mensaje-sintomas"></p>
        </section>

        <!-- ===================== VENTANA DEL CALENDARIO =====================
             <dialog> es una ventana que sale por encima de la página.
             Está oculta hasta que principal.js la abre con .showModal().
             La ponemos al final porque no ocupa sitio en la pantalla. -->
        <dialog id="ventana-registro" class="ventana">
            <h3 id="titulo-ventana" class="titulo-ventana">Registrar periodo</h3>

            <!-- Solo se ve al terminar un periodo: dice cuándo empezó -->
            <p id="info-inicio" class="ayuda"></p>

            <!-- type="date" hace que el navegador muestre un calendario para elegir el día -->
            <div class="campo" id="campo-inicio">
                <label for="fecha-inicio">Fecha de inicio</label>
                <input type="date" id="fecha-inicio">
            </div>

            <div class="campo">
                <label for="fecha-fin">Fecha de fin</label>
                <input type="date" id="fecha-fin">
                <!-- Si no se elige fin, el periodo se guarda "en curso" y se termina más tarde -->
                <span id="ayuda-fin" class="ayuda">Déjala vacía si tu periodo sigue en curso</span>
            </div>

            <!-- Aquí principal.js escribe los errores (usa el estilo #mensaje de styles.css) -->
            <p id="mensaje"></p>

            <div class="acciones">
                <button id="guardar-periodo" class="boton boton-principal">GUARDAR</button>
                <button id="cancelar-periodo" class="boton boton-secundario">CANCELAR</button>
            </div>
        </dialog>

        <!-- ===================== MENÚ INFERIOR =====================
             Enlaces normales (<a>) entre páginas. "activo" pinta de rosa la página actual. -->
        <nav class="navegacion-inferior">
            <a href="principal.html" class="nav-item activo"><span>📝</span> Registro</a>
            <a href="estadisticas.html" class="nav-item"><span>📊</span> Estadísticas</a>
        </nav>

    </main>

    <script src="js/principal.js"></script>
</body>
</html>
