<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estadísticas - IZAR</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Misma caja que principal.html, para que las dos pantallas se vean iguales -->
    <main class="caja aplicacion">

        <!-- ===================== CABECERA: logo y perfil ===================== -->
        <header class="cabecera-app">
            <div class="marca">
                <svg class="estrella" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/>
                </svg>
                <span class="nombre">IZAR</span>
            </div>
            <div class="icono-perfil">👤</div>
        </header>

        <!-- ===================== ÚLTIMOS PERIODOS (máximo 5) =====================
             estadisticas.js rellena la lista con "ultimos_periodos" de /dashboard
             (función 5G de ciclos.py): una fila por periodo, del más reciente al más antiguo. -->
        <section class="tarjeta">
            <h3 class="titulo-seccion">ÚLTIMOS PERIODOS</h3>

            <ul id="lista-periodos" class="lista-periodos">
                <!-- Mientras carga solo se ve este texto; luego se sustituye por las filas -->
                <li class="texto-vacio">Cargando...</li>
            </ul>
        </section>

        <!-- ===================== HOY: día del ciclo y posibles síntomas ===================== -->
        <section class="tarjeta">
            <h3 class="titulo-seccion">HOY</h3>

            <!-- El día del ciclo: estadisticas.js lo pide a /dashboard -->
            <div class="dato-grande">
                <span id="dia-ciclo" class="numero">–</span>
                <span class="etiqueta">día de tu ciclo</span>
            </div>

            <!-- Posibles síntomas: estadisticas.js rellena la lista con "sintomas_posibles"
                 de /dashboard (función 5F de ciclos.py). -->
            <p class="subtitulo-tarjeta">Es posible que hoy tengas</p>
            <div id="lista-sintomas" class="lista-sintomas">
                <!-- Mientras carga solo se ve este texto; luego se sustituye -->
                <span class="texto-vacio">Cargando...</span>
            </div>
            <!-- Explica de dónde sale la predicción (o por qué todavía no hay) -->
            <p id="explicacion-sintomas" class="nota nota-abajo"></p>
        </section>

        <!-- ===================== MENÚ INFERIOR =====================
             Aquí la página activa (en rosa) es Estadísticas -->
        <nav class="navegacion-inferior">
            <a href="principal.html" class="nav-item"><span>📝</span> Registro</a>
            <a href="estadisticas.html" class="nav-item activo"><span>📊</span> Estadísticas</a>
        </nav>

    </main>

    <script src="js/estadisticas.js"></script>
</body>
</html>
