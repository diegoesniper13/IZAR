<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estadísticas - IZAR</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Misma caja que principal.html, para que las dos pantallas se vean iguales -->
    <main class="caja aplicacion">

        <!-- ===================== CABECERA: menú, logo y ajustes ===================== -->
        <header class="cabecera-app">
            <!-- Botón ☰: abre el menú lateral (lo controla js/menu.js) -->
            <button id="abrir-menu" class="boton-menu" type="button" aria-label="Abrir menú"
                    aria-expanded="false" aria-controls="menu-lateral">
                <span></span><span></span><span></span>
            </button>
            <div class="marca">
                <svg class="estrella" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/>
                </svg>
                <span class="nombre">IZAR</span>
            </div>
            <!-- Engranaje: lleva a la página de ajustes -->
            <a href="ajustes.html" class="icono-ajustes" aria-label="Ajustes"><svg viewBox="0 0 24 24"><path d="M19.4 13c.04-.33.06-.66.06-1s-.02-.67-.06-1l2.11-1.65a.5.5 0 0 0 .12-.64l-2-3.46a.5.5 0 0 0-.61-.22l-2.49 1a7.3 7.3 0 0 0-1.73-1l-.38-2.65A.5.5 0 0 0 14 1h-4a.5.5 0 0 0-.49.42l-.38 2.65c-.62.25-1.2.59-1.73 1l-2.49-1a.5.5 0 0 0-.61.22l-2 3.46a.5.5 0 0 0 .12.64L4.6 11c-.04.33-.06.66-.06 1s.02.67.06 1l-2.11 1.65a.5.5 0 0 0-.12.64l2 3.46c.14.24.44.32.68.22l2.49-1c.53.41 1.11.75 1.73 1l.38 2.65c.04.24.25.42.49.42h4c.24 0 .45-.18.49-.42l.38-2.65c.62-.25 1.2-.59 1.73-1l2.49 1c.24.1.54.02.68-.22l2-3.46a.5.5 0 0 0-.12-.64L19.4 13zM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7z"/></svg></a>
        </header>

        <!-- ===================== ÚLTIMOS PERIODOS (máximo 5) =====================
             estadisticas.js rellena la lista con "ultimos_periodos" de /dashboard
             (función 5G de ciclos.py): una fila por periodo, del más reciente al más antiguo. -->
        <section class="tarjeta">
            <h3 class="titulo-seccion">ÚLTIMOS PERIODOS</h3>

            <ul id="lista-periodos" class="lista-periodos">
                <!-- Mientras carga solo se ve este texto; luego se sustituye por las filas -->
                <li class="texto-vacio">Cargando...</li>
            </ul>
        </section>

        <!-- ===================== HOY: día del ciclo y posibles síntomas ===================== -->
        <section class="tarjeta">
            <h3 class="titulo-seccion">HOY</h3>

            <!-- El día del ciclo: estadisticas.js lo pide a /dashboard -->
            <div class="dato-grande">
                <span id="dia-ciclo" class="numero">–</span>
                <span class="etiqueta">día de tu ciclo</span>
            </div>

            <!-- Posibles síntomas: estadisticas.js rellena la lista con "sintomas_posibles"
                 de /dashboard (función 5F de ciclos.py). -->
            <p class="subtitulo-tarjeta">Es posible que hoy tengas</p>
            <div id="lista-sintomas" class="lista-sintomas">
                <!-- Mientras carga solo se ve este texto; luego se sustituye -->
                <span class="texto-vacio">Cargando...</span>
            </div>
            <!-- Explica de dónde sale la predicción (o por qué todavía no hay) -->
            <p id="explicacion-sintomas" class="nota nota-abajo"></p>
        </section>

        <!-- ===================== MENÚ LATERAL =====================
             Escondido a la izquierda hasta que js/menu.js le pone la clase "abierto".
             "fondo-menu" es la capa oscura de detrás: al tocarla, el menú se cierra.
             "activo" pinta de rosa la página en la que estás. -->
        <div id="fondo-menu" class="fondo-menu"></div>
        <nav id="menu-lateral" class="menu-lateral" aria-label="Menú principal">
            <div class="cabecera-menu">
                <span class="nombre">IZAR</span>
                <button id="cerrar-menu" class="boton-cerrar-menu" type="button" aria-label="Cerrar menú">✕</button>
            </div>
            <a href="principal.html" class="item-menu"><span>📝</span> Registro</a>
            <a href="estadisticas.html" class="item-menu activo"><span>📊</span> Estadísticas</a>
            <a href="calendario.html" class="item-menu"><span>📅</span> Calendario</a>
            <a href="informacion.html" class="item-menu"><span>📖</span> Información</a>
            <hr class="separador-menu">
            <a href="ajustes.html" class="item-menu"><span>⚙️</span> Ajustes</a>
        </nav>

    </main>

    <script src="js/menu.js"></script>
    <script src="js/estadisticas.js"></script>
</body>
</html>
